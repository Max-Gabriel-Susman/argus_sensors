name: ROS 2 CI (argus_sensors)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Use a prebuilt ROS 2 Humble (Jammy) dev image from ros-tooling
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/ubuntu-jammy-ros-humble-ros-base
      # optional but nice for ROS 2 shared memory things; harmless for builds
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test argus_sensors
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: argus_sensors
          target-ros2-distro: humble
          colcon-defaults: |
            {
              "build": {
                "symlink-install": true
              }
            }

